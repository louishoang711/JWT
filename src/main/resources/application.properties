spring.application.name=JWT
server.port=8005

# SQL Server running on the local default instance. Override with environment variables when needed.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=JWT;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:123456}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Base64 for a 32-byte development-only key. Set JWT_SECRET_KEY in real deployments.
security.jwt.secret-key=${JWT_SECRET_KEY:Q2hhbmdlTWVfVGhpcy1Jcy1Pbkx5LURldi1TZWNyZXQ=}
# 1 hour in milliseconds
security.jwt.expiration-time=3600000

spring.thymeleaf.cache=false
