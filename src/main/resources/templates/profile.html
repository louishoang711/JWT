<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hồ sơ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 720px">
    <div class="card border-0 shadow-sm">
        <div class="card-body p-4 p-md-5">
            <div class="d-flex justify-content-between align-items-start mb-4">
                <div>
                    <h1 class="h3 mb-0">Thông tin người dùng</h1>
                </div>
                <button id="logout" type="button" class="btn btn-outline-danger">Đăng xuất</button>
            </div>

            <div id="feedback" class="alert d-none" role="alert"></div>

            <div id="profile" class="d-flex align-items-center gap-4">
                <img id="images" src="/images/default-avatar.svg" alt="Ảnh đại diện"
                     class="rounded-circle border" width="120" height="120">
                <div>
                    <h2 id="profile-name" class="h4 mb-2">Đang tải...</h2>
                    <p id="profile-email" class="text-secondary mb-0"></p>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="/js/mainjs.js"></script>
</body>
</html>
